name: Node.js CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    name: Node.js ${{matrix.node-version}} on ${{matrix.os}}
    runs-on: ${{matrix.os}}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [22, 24, 26]

    steps:
      - uses: actions/checkout@v7
        # with:
        #   submodules: true
      - name: Setup Node.js ${{matrix.node-version}}
        uses: actions/setup-node@v7
        with:
          node-version: ${{matrix.node-version}}
      - run: npm ci
      - run: npm test
      - run: npm run ts-test
